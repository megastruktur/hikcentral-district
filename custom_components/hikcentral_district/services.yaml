door_action:
  description: Send an action to a HikCentral door.
  fields:
    door_id:
      description: The HikCentral door element ID.
      example: "996"
      required: true
      selector:
        text:
    action:
      description: >-
        The action to perform on the door:
        1 = unlock/open, 2 = lock, 3 = remain unlocked, 4 = remain locked.
      example: 1
      required: true
      selector:
        number:
          min: 1
          max: 4
          step: 1
          mode: box

refresh_snapshot:
  description: >-
    Fetch a fresh snapshot from a HikCentral camera and write it atomically
    to <config>/www/snapshots/<filename>. Updates the camera entity image
    cache and its last_snapshot attribute (ISO-8601 UTC).
  fields:
    entity_id:
      description: The HikCentral camera entity to snapshot.
      example: "camera.mr5_p2a"
      required: true
      selector:
        entity:
          domain: camera
    filename:
      description: >-
        Target file name inside www/snapshots/. Defaults to the entity_id
        without the domain plus ".jpg" (e.g. mr5_p2a.jpg).
      example: "mr5-p2a.jpg"
      required: false
      selector:
        text:
